name: RMCP 2.1 validation

on:
  push:
    branches:
      - release/2.1

permissions:
  contents: read

jobs:
  macro-contract:
    name: Macro duplicate-name contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"

      - name: Run macro contract tests
        run: cargo test -p rmcp-macros --test trybuild
