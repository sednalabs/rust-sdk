name: Temporary large-handler red-green proof
on:
  pull_request:
    branches: [baseline/rmcp-3-8-0-20261101]
permissions:
  contents: read
jobs:
  bounded-dispatch:
    if: github.event.pull_request.head.ref == 'fix/box-request-dispatch-futures' && github.event.pull_request.head.repo.full_name == 'sednalabs/rust-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Rust 1.99
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Verify unchanged default stack and fixed behavior
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: |
          set -euo pipefail
          test -z "${RUST_MIN_STACK:-}"
          cargo fmt --all -- --check
          cargo test -p rmcp --lib --features client service::large_handler_future_tests::large_resource_future_preserves_context_and_cancellation -- --exact --nocapture
      - name: Calibrate default-stack red-green fixture without changing runtime limits
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: |
          set -euo pipefail
          cp crates/rmcp/src/service.rs /tmp/bounded-service.rs
          cp crates/rmcp/src/service/large_handler_future_tests.rs /tmp/large-handler-test.rs
          trap 'cp /tmp/bounded-service.rs crates/rmcp/src/service.rs; cp /tmp/large-handler-test.rs crates/rmcp/src/service/large_handler_future_tests.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          service = Path("crates/rmcp/src/service.rs")
          test = Path("crates/rmcp/src/service/large_handler_future_tests.rs")
          fixed = service.read_text()
          fixture = test.read_text()
          needle = "Box::pin(service.handle_request(request, context))"
          assert fixed.count(needle) == 1
          assert fixture.count("const HANDLER_BYTES: usize = 128 * 1024;") == 1
          command = ["cargo", "test", "-p", "rmcp", "--lib", "--features", "client", "service::large_handler_future_tests::large_resource_future_preserves_context_and_cancellation", "--", "--exact", "--nocapture"]
          for size in (192, 256, 384, 512):
              test.write_text(fixture.replace("const HANDLER_BYTES: usize = 128 * 1024;", f"const HANDLER_BYTES: usize = {size} * 1024;"))
              outcomes = {}
              for label, source in (("fixed", fixed), ("baseline", fixed.replace(needle, "service.handle_request(request, context)"))):
                  service.write_text(source)
                  result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  outcomes[label] = result
                  print(f"CALIBRATION size_kib={size} variant={label} exit={result.returncode}", flush=True)
                  print(result.stdout, flush=True)
              if outcomes["fixed"].returncode == 0 and outcomes["baseline"].returncode != 0 and "stack overflow" in outcomes["baseline"].stdout:
                  print(f"PROVEN_DEFAULT_STACK_FIXTURE_KIB={size}", flush=True)
                  break
          else:
              raise SystemExit("No baseline-red/fixed-green fixture size found")
          PY
